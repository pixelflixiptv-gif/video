<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE APARTMENT RULES - PART 1</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
html,body{margin:0;height:100%;background:#050505;overflow:hidden}
body{display:flex;flex-direction:column}
#wrap{position:relative;flex:1;min-height:0;overflow:hidden;background:#000}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;margin:-960px 0 0 -540px;transform-origin:50% 50%;background:#000;overflow:hidden;font-family:Impact,'Arial Black',Haettenschweiler,sans-serif;user-select:none;-webkit-user-select:none}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none}
#world{will-change:transform,filter;transform-origin:50% 50%}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none}
.scene svg{width:1080px;height:1920px;display:block}
svg text{font-family:Impact,'Arial Black',Haettenschweiler,sans-serif}
[data-a],[data-pop]{transform-box:fill-box;transform-origin:50% 50%}
#whip{background:repeating-linear-gradient(90deg,rgba(255,255,255,.0) 0 18px,rgba(255,255,255,.55) 18px 22px,rgba(255,255,255,0) 22px 47px,rgba(255,255,255,.3) 47px 49px);opacity:0;z-index:12}
#fx{z-index:14}
#vigBase{z-index:16;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 48%,rgba(0,0,0,.55) 100%)}
#vigPulse{z-index:17;opacity:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 38%,rgb(var(--vc,255,40,40)) 125%)}
#flash{z-index:18;background:#fff;opacity:0}
#banner{position:absolute;left:0;top:0;width:1080px;height:116px;z-index:45;background:linear-gradient(#e5192c,#a30d1b);border-bottom:6px solid rgba(255,255,255,.25);box-shadow:0 8px 26px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:58px;letter-spacing:3px;text-shadow:0 4px 0 #5a0610;white-space:nowrap}
#banner i{display:inline-block;width:18px;height:18px;border-radius:50%;background:#fff;margin:0 22px;animation:rec 1.2s infinite}
@keyframes rec{50%{opacity:.15}}
#lbl{position:absolute;left:34px;top:140px;z-index:30;padding:10px 26px 10px 20px;background:rgba(8,8,12,.82);border:4px solid #fff;border-radius:40px;color:#fff;font-size:38px;letter-spacing:2px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#lbl b{width:18px;height:18px;border-radius:50%;background:#a6ff2e;box-shadow:0 0 14px #a6ff2e}
#lbl span{color:#a6ff2e}
#cap{position:absolute;left:0;top:1292px;width:1080px;height:250px;z-index:30;display:flex;align-items:center;justify-content:center;pointer-events:none}
#capw{font-size:170px;line-height:1;color:#fff;text-transform:uppercase;white-space:nowrap;-webkit-text-stroke:18px #000;paint-order:stroke fill;text-shadow:0 9px 0 #000,0 0 34px rgba(0,0,0,.8);letter-spacing:2px;will-change:transform}
#sub{position:absolute;left:46px;top:1700px;width:988px;z-index:30;text-align:center;font:800 46px/1.22 'Arial Black',Arial,sans-serif;color:#fff;background:rgba(0,0,0,.6);border-radius:26px;padding:16px 26px;opacity:0;text-shadow:0 3px 0 #000;box-sizing:border-box}
#sub .sw{opacity:.5;transition:opacity .08s}
#sub .sw.sp{opacity:1}
#sub .sw.kw{color:#a6ff2e}
#sub .sw.cur{color:#ffe14a;text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
#sub .sw.kw.cur{color:#a6ff2e}
#end{z-index:40;opacity:0;transform:scale(1.08);transition:opacity .35s,transform .35s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;pointer-events:none;color:#fff;text-align:center}
#end.on{opacity:1;transform:none}
#end .ebg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(120,10,20,.86),rgba(8,2,6,.97) 72%)}
#end .erays{position:absolute;left:-420px;top:200px;width:1920px;height:1920px;background:repeating-conic-gradient(rgba(255,60,60,.16) 0 7deg,rgba(0,0,0,0) 7deg 20deg);animation:spin 40s linear infinite;border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
#end>*:not(.ebg):not(.erays){position:relative}
#end .e-tag{margin-top:150px;font-size:44px;letter-spacing:6px;color:#ffd35a}
#end .e-q{font-size:104px;line-height:1.02;padding:0 50px;text-shadow:0 8px 0 #000,0 0 30px #000}
#end .e-q em{font-style:normal;color:#a6ff2e}
#end .e-opts{display:flex;gap:34px;margin-top:6px}
#end .opt{width:430px;padding:26px 10px;border-radius:30px;border:6px solid #fff;background:rgba(0,0,0,.55);font-size:58px;line-height:1.05}
#end .opt small{display:block;font-size:34px;color:#ffd35a;margin-bottom:8px;letter-spacing:3px}
#end .e-or{font-size:56px;color:#ff5347}
#end .e-cta{margin-top:28px;font-size:76px;line-height:1.05;color:#0b0b0b;background:#a6ff2e;padding:20px 40px;border-radius:24px;border:6px solid #000;box-shadow:0 0 0 6px #a6ff2e55;transform:rotate(-2deg)}
#end .e-p2{font-size:54px;color:#fff;background:#d4182b;padding:14px 34px;border-radius:16px;border:5px solid #fff;letter-spacing:2px}
#end.on .e-tag{animation:pin .5s .05s both}
#end.on .e-q1{animation:pin .55s .25s both}
#end.on .e-opts{animation:pin .55s .6s both}
#end.on .e-cta{animation:pin .55s 1s both,pulse 1.1s 1.6s infinite}
#end.on .e-p2{animation:pin .55s 1.5s both}
@keyframes pin{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.07)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{50%{transform:rotate(-2deg) scale(1.05)}}
#start{z-index:60;background:radial-gradient(ellipse at center,rgba(40,6,10,.93),rgba(0,0,0,.98));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;color:#fff;text-align:center;pointer-events:auto;cursor:pointer}
#start h1{font-size:112px;line-height:1.02;margin:0;padding:0 60px;text-shadow:0 8px 0 #7a0a14}
#start h1 span{display:block;font-size:64px;color:#ffd35a;letter-spacing:6px;margin-top:16px}
#start .big{width:260px;height:260px;border-radius:50%;background:#e5192c;border:10px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px rgba(229,25,44,.35);animation:pulse2 1.3s infinite}
#start .big:after{content:"";border-left:96px solid #fff;border-top:62px solid transparent;border-bottom:62px solid transparent;margin-left:26px}
@keyframes pulse2{50%{transform:scale(1.07)}}
#start p{font:700 40px 'Arial',sans-serif;color:#cfcfd8;margin:0}
.knob{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#fff;box-shadow:0 0 6px #000}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <div id="world" class="layer"><div id="sceneLayer" class="layer"></div></div>
    <div id="whip" class="layer"></div>
    <canvas id="fx" class="layer" width="1080" height="1920"></canvas>
    <div id="vigBase" class="layer"></div>
    <div id="vigPulse" class="layer"></div>
    <div id="flash" class="layer"></div>
    <div id="banner"><i></i>THE APARTMENT RULES - PART 1<i></i></div>
    <div id="lbl"><b></b><div id="lblt"></div></div>
    <div id="cap"><div id="capw"></div></div>
    <div id="sub"></div>
    <div id="end" class="layer">
      <div class="ebg"></div><div class="erays"></div>
      <div class="e-tag">THE APARTMENT RULES · PART 1</div>
      <div class="e-q e-q1">DO YOU STAY IN THE <em>LAUNDRY ROOM</em>?<br><span style="color:#ff5347;font-size:60px">OR</span><br>DO YOU RUN FOR THE <em>STAIRS</em>?</div>
      <div class="e-opts"><div class="opt"><small>OPTION A</small>STAY</div><div class="opt"><small>OPTION B</small>RUN</div></div>
      <div class="e-cta">DROP YOUR GUESS<br>IN THE COMMENTS</div>
      <div class="e-p2">PART 2 DEPENDS ON YOUR ANSWER</div>
    </div>
    <div id="start" class="layer"><h1>THE APARTMENT RULES<span>PART 1 · HORROR STORY</span></h1><div class="big"></div><p>TAP TO PLAY · SOUND ON</p></div>
  </div>
</div>
<div id="ctrl" class="flex items-center gap-3 px-4 py-3 bg-zinc-950 border-t border-zinc-800 text-zinc-200 select-none" style="font-family:system-ui,sans-serif">
  <button id="btnPlay" class="w-28 py-2 rounded-lg bg-red-600 hover:bg-red-500 font-bold text-white">▶ Play</button>
  <div id="bar" class="relative flex-1 h-4 bg-zinc-800 rounded-full cursor-pointer" style="touch-action:none">
    <div id="fill" class="absolute left-0 top-0 h-full bg-red-500 rounded-full" style="width:0"></div>
    <div id="ticks"></div>
    <div id="knob" class="knob" style="left:0"></div>
  </div>
  <div id="time" class="tabular-nums text-sm w-28 text-right">0:00 / 2:00</div>
  <button id="btnSfx" class="px-3 py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-sm">SFX on</button>
  <span id="note" class="hidden text-xs text-amber-400"></span>
</div>
<audio id="aud" src="narration.mp3" preload="auto"></audio>

<script>
/* =====================================================================
   THE APARTMENT RULES - PART 1  |  index.html  (STEP 1: framework)
   Layout of this file:
   1. constants + helpers      4. timeline / caption engine
   2. SVG art helpers + cast   5. scene registry (defScene)  <-- plug scenes in here
   3. WebAudio SFX engine      6. render loop, transport, UI
   ===================================================================== */
const DUR=120.65, SPEECH_END=115.45;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
let _u=0; const uid=()=>'u'+(++_u);
const $=id=>document.getElementById(id);

/* ---------------- SVG string helpers ---------------- */
const INK='#1d2230';
const rc=(x,y,w,h,f,ex='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${ex}/>`;
const ci=(x,y,r,f,ex='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" ${ex}/>`;
const el=(x,y,rx,ry,f,ex='')=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" ${ex}/>`;
const pg=(pts,f,ex='')=>`<polygon points="${pts}" fill="${f}" ${ex}/>`;
const pa=(d,f,ex='')=>`<path d="${d}" fill="${f}" ${ex}/>`;
const ln=(x1,y1,x2,y2,s,w,ex='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${s}" stroke-width="${w}" stroke-linecap="round" ${ex}/>`;
const st=(d,s,w,ex='')=>`<path d="${d}" fill="none" stroke="${s}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${ex}/>`;
const tx=(x,y,t,size,f,ex='')=>`<text x="${x}" y="${y}" font-size="${size}" fill="${f}" text-anchor="middle" ${ex}>${t}</text>`;
const gg=(tr,inner,ex='')=>`<g transform="${tr}" ${ex}>${inner}</g>`;
/* animated wrapper: spec = "type:p1,p2,.." (see animTf).  origin e.g. '50% 100%' */
const A=(spec,inner,origin)=>`<g data-a="${spec}" ${origin?`style="transform-origin:${origin}"`:''}>${inner}</g>`;
const LG=(id,c1,c2,x2=0,y2=1)=>`<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
const RG=(id,c1,c2,o1=1,o2=0)=>`<radialGradient id="${id}"><stop offset="0" stop-color="${c1}" stop-opacity="${o1}"/><stop offset="1" stop-color="${c2}" stop-opacity="${o2}"/></radialGradient>`;
function wrapText(t,n){const w=t.split(' '),o=[];let c='';w.forEach(x=>{if((c+' '+x).trim().length>n){o.push(c.trim());c=x}else c+=' '+x});if(c.trim())o.push(c.trim());return o}

/* ---- effects library ---- */
function rays(cx,cy,n,r2,fill,op=.2,spin=6){let s='';for(let i=0;i<n;i++){const a=i*2*Math.PI/n,w=Math.PI/n*.55;s+=`<polygon points="${cx},${cy} ${(cx+Math.cos(a-w)*r2).toFixed(1)},${(cy+Math.sin(a-w)*r2).toFixed(1)} ${(cx+Math.cos(a+w)*r2).toFixed(1)},${(cy+Math.sin(a+w)*r2).toFixed(1)}" fill="${fill}"/>`}
  return `<g opacity="${op}"><g data-a="spin:${spin}">${s}</g></g>`}
function speedLines(cx,cy,n,r1,r2,col='#fff',op=.85){let s='';for(let i=0;i<n;i++){const r=Math.sin(i*91.7)*43758.5453,f=r-Math.floor(r),a=i*2*Math.PI/n+f*.2,rr1=r1+f*60,rr2=r2*(.75+f*.5),w=.012+f*.016;
  s+=`<polygon points="${(cx+Math.cos(a)*rr1).toFixed(1)},${(cy+Math.sin(a)*rr1).toFixed(1)} ${(cx+Math.cos(a-w)*rr2).toFixed(1)},${(cy+Math.sin(a-w)*rr2).toFixed(1)} ${(cx+Math.cos(a+w)*rr2).toFixed(1)},${(cy+Math.sin(a+w)*rr2).toFixed(1)}" fill="${col}"/>`}
  return `<g opacity="${op}"><g data-a="blink:11,0,.35">${s}</g></g>`}
function burst(x,y,r,fill,at,txt='',o={}){const n=14;let p='';for(let i=0;i<n*2;i++){const a=i*Math.PI/n,rr=(i%2?r*.58:r)*(1+.12*Math.sin(i*2.7));p+=`${(x+Math.cos(a)*rr).toFixed(1)},${(y+Math.sin(a)*rr).toFixed(1)} `}
  return `<g data-pop="${at}" data-show="${at},${at+(o.dur||.75)}"><polygon points="${p}" fill="${fill}" stroke="${o.stroke||'#111'}" stroke-width="8" stroke-linejoin="round"/>${txt?tx(x,y+(o.fs||60)*.34,txt,o.fs||60,o.color||'#111'):''}</g>`}
function spark(x,y,s,fill='#ffe27a',ph=0){return `<g transform="translate(${x} ${y})"><g data-a="pulse:.55,1.7,${ph}"><path d="M0 ${-s} Q${s*.14} ${-s*.14} ${s} 0 Q${s*.14} ${s*.14} 0 ${s} Q${-s*.14} ${s*.14} ${-s} 0 Q${-s*.14} ${-s*.14} 0 ${-s}Z" fill="${fill}"/></g></g>`}
function sweatDrop(x,y,ph=0,sc=1){return `<g transform="translate(${x} ${y}) scale(${sc})"><g data-a="drip:46,34,${ph}"><path d="M0 -15 Q11 4 0 13 Q-11 4 0 -15Z" fill="#9fe0ff" stroke="${INK}" stroke-width="3"/></g></g>`}
function pill(x,y,t,o={}){const fs=o.fs||44,w=o.w||(t.length*fs*.56+60),h=fs+30,at=o.at??0;
  return `<g transform="translate(${x} ${y}) rotate(${o.rot||0})"><g data-pop="${at}" ${o.show?`data-show="${o.show}"`:''}><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="${o.fill||'#111'}" stroke="${o.stroke||'#fff'}" stroke-width="5"/>${tx(0,fs*.36,t,fs,o.color||'#fff')}</g></g>`}
function magnify(cx,cy,r,sx,sy,k,inner,at=0,bg='#fffdf0'){const id=uid();
  return `<g data-pop="${at}"><defs><clipPath id="${id}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath></defs><circle cx="${cx}" cy="${cy}" r="${r}" fill="${bg}"/><g clip-path="url(#${id})"><g transform="translate(${cx} ${cy}) scale(${k}) translate(${-sx} ${-sy})">${inner}</g></g><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#fff" stroke-width="13"/><circle cx="${cx}" cy="${cy}" r="${r+7}" fill="none" stroke="#111" stroke-width="4"/>${ln(cx+r*.72,cy+r*.72,cx+r*1.32,cy+r*1.32,'#fff',24)}</g>`}
function dashDraw(d,col,w,at,dur,dash='24 18'){const id=uid();return `<defs><mask id="${id}" maskUnits="userSpaceOnUse" x="-300" y="-300" width="1700" height="2600"><path d="${d}" fill="none" stroke="#fff" stroke-width="${w+14}" stroke-linecap="round" data-draw="${at},${dur}"/></mask></defs><path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${dash}" mask="url(#${id})"/>`}
const drawLine=(d,col,w,at,dur)=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" data-draw="${at},${dur}"/>`;
const qmark=(x,y,s,col,ph=0)=>`<g transform="translate(${x} ${y})">${A(`bob:12,.9,${ph}`,tx(0,0,'?',s,col,`stroke="#000" stroke-width="${s/12}" paint-order="stroke"`))}</g>`;

/* ---- cast: faces (swapped wholesale, never morphed) ---- */
const S=(d,w=6)=>`<path d="${d}" stroke="${INK}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
const dot=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${INK}"/><circle cx="${x+r*.3}" cy="${y-r*.35}" r="${r*.3}" fill="#fff"/>`;
const wide=(x,y,r,pr,px=0)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${INK}" stroke-width="5"/><circle cx="${x+px}" cy="${y}" r="${pr}" fill="${INK}"/>`;
const FACE={
 calm:dot(-24,-6,7)+dot(24,-6,7)+S('M-16 30 Q0 38 16 30'),
 worried:dot(-24,-4,8)+dot(24,-4,8)+S('M-42 -24 L-14 -36')+S('M14 -36 L42 -24')+S('M-18 38 Q0 24 18 38'),
 shocked:wide(-24,-6,16,4.5)+wide(24,-6,16,4.5)+S('M-46 -42 Q-28 -58 -10 -46')+S('M10 -46 Q28 -58 46 -42')+`<ellipse cx="0" cy="38" rx="12" ry="17" fill="#3b1a24" stroke="${INK}" stroke-width="5"/>`,
 sweat:`<g data-a="shake:1.4">`+wide(-24,-4,13,4.5,-3)+wide(24,-4,13,4.5,-3)+S('M-44 -26 L-14 -42')+S('M14 -42 L44 -26')+S('M-26 38 Q-13 26 0 38 T26 38')+`</g>`+sweatDrop(56,-34,0)+sweatDrop(-58,-8,.5,.8),
 terrified:`<g data-a="shake:2.6">`+`<ellipse cx="-44" cy="14" rx="14" ry="8" fill="#9ed2ff" opacity=".55"/><ellipse cx="44" cy="14" rx="14" ry="8" fill="#9ed2ff" opacity=".55"/>`+wide(-24,-8,19,3)+wide(24,-8,19,3)+S('M-48 -44 L-14 -62')+S('M14 -62 L48 -44')+`<path d="M-26 24 Q0 74 26 24 Q0 14 -26 24Z" fill="#3b1a24" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><path d="M-16 24 L16 24" stroke="#fff" stroke-width="7"/></g>`+sweatDrop(60,-30,.2)+sweatDrop(-62,-14,.7,.8),
 smug:S('M-38 -6 Q-25 -18 -12 -6')+S('M12 -6 Q25 -18 38 -6')+dot(-25,-1,5)+dot(25,-1,5)+S('M-44 -26 L-14 -28')+S('M12 -36 Q28 -48 44 -32')+S('M-16 32 Q6 44 26 22'),
 determined:S('M-46 -30 L-12 -16')+S('M12 -16 L46 -30')+`<ellipse cx="-24" cy="-4" rx="9" ry="6" fill="${INK}"/><ellipse cx="24" cy="-4" rx="9" ry="6" fill="${INK}"/>`+S('M-18 34 L18 34')
};
const POSES={
 stand:{L:[-92,-150],R:[92,-150],lean:0},point:{L:[-84,-165],R:[205,-300],lean:3},recoil:{L:[-138,-345],R:[138,-345],lean:-9},
 clutch:{L:[-36,-240],R:[36,-240],lean:0},headhands:{L:[-100,-392],R:[100,-392],lean:0},listen:{L:[-80,-170],R:[104,-364],lean:5},
 write:{L:[-80,-170],R:[118,-205],lean:6},shrug:{L:[-138,-262],R:[138,-262],lean:0},hold:{L:[-48,-205],R:[48,-205],lean:0},
 reach:{L:[-84,-165],R:[196,-250],lean:6},halt:{L:[-70,-170],R:[112,-336],lean:-4},hip:{L:[-92,-190],R:[92,-190],lean:0}
};
function limb(sx,sy,hx,hy,col,hand='#fff'){const mx=(sx+hx)/2+(hx>sx?10:-10),my=(sy+hy)/2+28;
  return `<path d="M${sx} ${sy} Q${mx} ${my} ${hx} ${hy}" stroke="${INK}" stroke-width="46" fill="none" stroke-linecap="round"/><path d="M${sx} ${sy} Q${mx} ${my} ${hx} ${hy}" stroke="${col}" stroke-width="35" fill="none" stroke-linecap="round"/><circle cx="${hx}" cy="${hy}" r="20" fill="${hand}" stroke="${INK}" stroke-width="5"/>`}
/* hero: round white head, teal shirt, dark pants. feet at (x,y). faces=[[name,from,to,lookX]] in beat-local seconds */
function hero(o){const {x=540,y=1200,s=1,pose='stand',faces=[['calm',0]],flip=false,anim='',prop='',lean}=o;const P=POSES[pose]||POSES.stand;
  const face=faces.map(([n,a,b,lk])=>`<g data-show="${a}${b===undefined?'':','+b}" transform="translate(${lk||0} 0)">${FACE[n]}</g>`).join('');

/*__SCENES__*/

/* ---------------- build all scenes ---------------- */
const sceneLayer=$('sceneLayer');
function buildScenes(){
  META.forEach((m,i)=>{if(!SCENES[i])SCENES[i]=Object.assign({},m,placeholderDef(i))});
  SCENES.forEach((sc,si)=>{
    sc.end=META[si+1]?META[si+1].start:DUR;
    const holder=document.createElement('div');holder.className='scene';sc.el=holder;let html='';
    sc.beats.forEach((b,bi)=>{b.t0=bi===0?sc.start:b.t;b.t1=bi<sc.beats.length-1?sc.beats[bi+1].t:sc.end});
    sc.beats.forEach((b,bi)=>{let inner='';
      try{inner=b.svg({t0:b.t0,t1:b.t1,d:b.t1-b.t0,L:a=>a-b.t0,sc,si,bi})}
      catch(err){console.error('beat error',si,bi,err);inner=rc(0,0,1080,1920,'#300')+tx(540,900,'BEAT ERROR '+si+'.'+bi,70,'#fff')}
      html+=`<g class="beat" style="display:none">${inner}</g>`});
    holder.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920">${html}</svg>`;
    sceneLayer.appendChild(holder);
    const gs=holder.querySelectorAll('svg > g.beat');sc.beats.forEach((b,bi)=>{b.g=gs[bi];b.anims=collectAnims(b.g)});sc.cur=-1});
}
buildScenes();

const audio=$('aud'),stage=$('stage'),wrapEl=$('wrap'),world=$('world'),whip=$('whip'),vigP=$('vigPulse'),flashEl=$('flash'),capW=$('capw'),subEl=$('sub'),lblT=$('lblt'),lblEl=$('lbl'),endEl=$('end'),startEl=$('start');

const DUST=Array.from({length:48},(_,i)=>{const r=n=>{const x=Math.sin(i*127.1+n*311.7)*43758.5453;return x-Math.floor(x)};return{x:r(1)*1080,y:r(2)*1920,s:1.5+r(3)*4.5,v:6+r(4)*24,w:.3+r(5)*.9,a:.1+r(6)*.25,p:r(7)*6.28,z:r(8)}});
function drawDust(t){fxc.clearRect(0,0,1080,1920);
  for(const d of DUST){const x=(((d.x+Math.sin(t*d.w+d.p)*36+t*d.v*.3)%1080)+1080)%1080,y=(((d.y-t*d.v)%1920)+1920)%1920,big=d.z>.86;
    fxc.globalAlpha=big?d.a*.55:d.a;fxc.fillStyle=big?'#ffeab0':'#fff';fxc.beginPath();fxc.arc(x,y,big?d.s*3.2:d.s,0,6.283);fxc.fill()}fxc.globalAlpha=1}

  let si=-1;for(let i=0;i<TL.length;i++){if(t>=TL[i].a&&t<TL[i].b+.12){si=i;break}}

/* ---------------- main render ---------------- */
let prevT=0,curScene=-1,wasPlaying=false,lastWhip=0;
function render(t,playing){
  let si=0;for(let i=SCENES.length-1;i>=0;i--)if(t>=SCENES[i].start){si=i;break}
  const sc=SCENES[si];
  if(si!==curScene){SCENES.forEach((s,i)=>s.el.style.display=i===si?'block':'none');curScene=si;setLabel(sc,si)}
  let bi=0;for(let i=sc.beats.length-1;i>=0;i--)if(t>=sc.beats[i].t0){bi=i;break}
  if(sc.cur!==bi){sc.beats.forEach((b,k)=>b.g.style.display=k===bi?'':'none');sc.cur=bi}
  const b=sc.beats[bi],bt=t-b.t0,wbt=clk(t)-clk(b.t0);
  camera(b,bt,t);applyAnims(b.anims,bt,wbt,t);
  /* 300ms vertical whip-blur between scenes (centred on each boundary) */
  let wa=0,ty=0;for(let i=1;i<SCENES.length;i++){const d=t-SCENES[i].start;if(Math.abs(d)<.15){wa=1-Math.abs(d)/.15;ty=d<0?-150*(1+d/.15):150*(1-d/.15)}}
  if(wa>0||lastWhip>0){world.style.transform=wa>0?`translateY(${ty}px) scaleY(${1+wa*.06})`:'none';world.style.filter=wa>0?`blur(${(wa*16).toFixed(1)}px) brightness(${1+wa*.25})`:'none';whip.style.opacity=wa*.9}
  lastWhip=wa;
  /* vignette pulse / flash */
  let vb=0,vc='255,40,40';for(const [a,d,c,s] of VIGC){const x=t-a;if(x>=0&&x<d){const v=s*Math.pow(1-x/d,1.5);if(v>vb){vb=v;vc=c}}}
  for(const [a,e,per,c] of HB){if(t>=a&&t<e){const ph=((t-a)%per)/per,v=.7*Math.exp(-ph*5)+(ph>.28?.5*Math.exp(-(ph-.28)*9):0);if(v>vb){vb=Math.min(1,v);vc=c}}}
  vigP.style.setProperty('--vc',vc);vigP.style.opacity=vb;
  let fl=0;for(const [a,d,s] of FLASH){const x=t-a;if(x>=0&&x<d)fl=Math.max(fl,s*(1-x/d))}flashEl.style.opacity=fl;
  drawDust(t);renderCaps(t);
  endEl.classList.toggle('on',t>=SPEECH_END);
  /* UI */
  const f=clamp(t/DUR,0,1);$('fill').style.width=f*100+'%';$('knob').style.left=f*100+'%';
  const m=x=>Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0');$('time').textContent=`${m(t)} / ${m(DUR)}`;
  $('btnPlay').textContent=playing?'❚❚ Pause':(t>=DUR-.05?'↻ Replay':'▶ Play');
}

/* ---------------- transport (audio-driven clock; silent virtual clock only if narration.mp3 fails to load) ---------------- */
let virtual=false,vPlaying=false,vT=0,vLast=0,lastAT=-1,lastPerf=0,seekFlag=false;
const isPlaying=()=>virtual?vPlaying:(!audio.paused&&!audio.ended);
function curT(){
  if(virtual){if(vPlaying){const p=performance.now();vT=Math.min(DUR,vT+(p-vLast)/1000);vLast=p;if(vT>=DUR)vPlaying=false}return vT}
  const at=audio.currentTime,p=performance.now();if(at!==lastAT){lastAT=at;lastPerf=p}
  let t=at;if(isPlaying())t=at+Math.min(.12,(p-lastPerf)/1000);return Math.min(t,DUR)}
function goVirtual(msg){virtual=true;vT=Math.max(vT,audio.currentTime||0);const n=$('note');n.textContent=msg;n.classList.remove('hidden')}
audio.addEventListener('error',()=>goVirtual('narration.mp3 not found next to index.html - silent preview'));
function startVirtual(){vPlaying=true;vLast=performance.now()}
function play(){SFX.resume();startEl.style.display='none';if(curT()>=DUR-.05)seek(0);
  if(virtual)startVirtual();else audio.play().catch(()=>{goVirtual('audio blocked - silent preview');startVirtual()})}
function pause(){if(virtual)vPlaying=false;else audio.pause();SFX.stopAll();WIN.forEach(w=>w.h=null)}
function seek(t){t=clamp(t,0,DUR-.001);if(virtual)vT=t;else{try{audio.currentTime=t}catch(e){}}prevT=t;lastAT=-1;seekFlag=true;SFX.stopAll();WIN.forEach(w=>w.h=null)}
function toggle(){isPlaying()?pause():play()}
$('btnPlay').addEventListener('click',toggle);startEl.addEventListener('click',play);
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle()}});
$('btnSfx').addEventListener('click',()=>{SFX.setMuted(!SFX.muted);$('btnSfx').textContent=SFX.muted?'SFX off':'SFX on'});
const bar=$('bar');let drag=false;
const seekFromEvt=e=>{const r=bar.getBoundingClientRect();seek(clamp((e.clientX-r.left)/r.width,0,1)*DUR)};
bar.addEventListener('pointerdown',e=>{drag=true;bar.setPointerCapture(e.pointerId);seekFromEvt(e)});
bar.addEventListener('pointermove',e=>{if(drag)seekFromEvt(e)});
bar.addEventListener('pointerup',()=>drag=false);
$('ticks').innerHTML=META.slice(1).map(m=>`<div style="position:absolute;top:0;height:100%;width:3px;background:rgba(255,255,255,.45);left:${m.start/DUR*100}%"></div>`).join('')+`<div style="position:absolute;top:0;height:100%;width:3px;background:#a6ff2e;left:${SPEECH_END/DUR*100}%"></div>`;

function loop(){
  let t=curT();const playing=isPlaying();
  if(!seekFlag&&t<prevT&&prevT-t<.12)t=prevT;
  if(seekFlag){seekFlag=false;prevT=t}
  if(wasPlaying&&!playing){SFX.stopAll();WIN.forEach(w=>w.h=null)}
  wasPlaying=playing;
  render(t,playing);sfxTick(prevT,t,playing);prevT=t;
  requestAnimationFrame(loop)}
render(0,false);requestAnimationFrame(loop);
</script>
