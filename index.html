<script>
/* =====================================================================
   THE ELEVATOR - PART 2  |  framework (step 1)
   - SCRIPT: exact timings from script.txt (never rescaled)
   - registerScene(index, {beats:[...]}) plugs a scene into the timeline
   ===================================================================== */
const SCRIPT = `THE ELEVATOR - PART 2 (Horror Story)
[3:31 AM - THE CAMERA]
    0.00 -   2.47  You chose the camera. Smart.
    2.85 -   6.76  Because what the camera shows you... is worse.
    7.14 -  11.39  And then... between one frame... and the next...
   11.77 -  13.38  Someone is standing there.

[CAM 02 - THE HALLWAY]
   14.23 -  17.23  He was not there a second ago. No door opening.
   17.61 -  21.81  Just... there. Facing your door. Perfectly still.
   22.19 -  26.61  Listening to what?... To you. Breathing.
   26.99 -  32.12  Then, slowly... he raises one hand...

[THE ELEVATOR]
   32.97 -  36.55  And the elevator dings... on the lobby floor.
   36.93 -  40.62  Wait. The lobby?... Nobody called it.
   41.00 -  45.25  On the camera, the doors open... to an empty hall.
   45.63 -  50.82  The number above them starts to climb. Coming... to you.

[3:33 AM - YOUR PHONE]
   51.67 -  54.74  Your phone buzzes in your shaking hand.
   55.12 -  58.19  A text. From your own number. Again.
   58.57 -  63.80  It says: The camera lies. I am already inside.
   64.18 -  68.14  Behind you... something in the dark apartment... breathes.

[RULE THREE]
   68.99 -  71.56  Rule three. Remember rule three?
   71.94 -  74.63  It ends when the elevator reaches the lobby.
   75.01 -  79.69  So you run. Not to the door. To the window. To the fire escape.
   80.07 -  84.53  And above you... the elevator dings... on your floor.

[THE LOBBY]
   85.38 -  88.55  But this time... it does not stop.
   88.93 -  95.36  The number drops. Five. Four. Three. Two.
   95.74 - 100.81  It is going down. It is leaving. It is... over?
  101.19 - 103.54  Your phone buzzes one last time.
  103.92 - 108.05  It says: Lobby. Your turn. Tomorrow night... you ride.
  108.43 - 112.10  Do you take the stairs forever?... Or do you ride it down?
`;
const SPEECH_END = 112.10, TOTAL = 117.30;

/* keyword (lime) + emotion per sentence, by sentence index */
const KEYWORDS = ['camera','worse','frame','Someone','not','still','Breathing','hand',
  'dings','Nobody','empty','climb','buzzes','own','inside','breathes',
  'three','lobby','window','floor','stop','drops','over','last','ride','forever'];
const EMO = ['mystery','fear','mystery','danger','fear','fear','fear','danger',
  'mystery','mystery','fear','danger','fear','mystery','danger','danger',
  'mystery','mystery','fear','danger','danger','fear','warm','fear','danger','mystery'];
const EMO_COL = {fear:'#d4ecff',danger:'#ff5656',mystery:'#ffffff',warm:'#ffd66b'};
const EMO_GLOW = {fear:'#5db4ff',danger:'#ff0000',mystery:'#a6ff2e',warm:'#ffb300'};

/* sound-effect cues: by sentence+word (resolved from timeline) or absolute time */
const CUE_DEF = [
  {s:8, w:'dings', fn:'ding'}, {s:19, w:'dings', fn:'ding'},
  {s:12, w:'buzzes', fn:'buzz'}, {s:23, w:'buzzes', fn:'buzz'},
  {s:24, w:'lobby', fn:'boom'},
  {t:11.45, fn:'hit'}, {t:17.55, fn:'hit'}
];

/* ---------------- tiny helpers ---------------- */
const $ = id => document.getElementById(id);
const A = o => ` data-a='${JSON.stringify(o)}'`;
const rng = seed => { let s = (Math.imul(seed + 7, 2654435761) >>> 0) || 1; return () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296); };
let UID = 0; const uid = p => (p || 'u') + (++UID);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const outBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const P = pts => pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const pad = n => String(n).padStart(2, '0');
const INK = '#1d2230';

/* ---------------- parse script.txt ---------------- */
function parseScript(txt) {
  const scenes = [], sent = []; let cur = null;
  txt.split(/\r?\n/).forEach(line => {
    let m = line.match(/^\s*\[(.+)\]\s*$/);
    if (m) { cur = { label: m[1], start: null }; scenes.push(cur); return; }
    m = line.match(/^\s*(\d+\.\d+)\s*-\s*(\d+\.\d+)\s+(.+?)\s*$/);
    if (m && cur) {
      const s = { start: +m[1], end: +m[2], text: m[3], scene: scenes.length - 1, idx: sent.length };
      sent.push(s); if (cur.start === null) cur.start = s.start;
    }
  });
  scenes[0].start = 0;
  return { scenes, sent };
}
const PARSED = parseScript(SCRIPT);
const SENT = PARSED.sent;

/* ---------------- word-by-word timing inside each exact sentence window ---------------- */
function buildWords(s) {
  const toks = s.text.split(/\s+/), chunks = [];
  for (let i = 0; i < toks.length; i++) {
    const bare = toks[i].replace(/[^A-Za-z']/g, '');
    if (i < toks.length - 1 && (bare.length <= 2 || bare.toLowerCase() === 'the')) { toks[i + 1] = toks[i] + ' ' + toks[i + 1]; continue; }
    chunks.push({ text: toks[i] });
  }
  let W = 0;
  chunks.forEach((c, i) => {
    const letters = c.text.replace(/[^A-Za-z']/g, '').length;
    c.w = 2 + letters;
    const last = i === chunks.length - 1;
    c.p = last ? 0 : /\.\.\.|\u2026/.test(c.text.slice(-3)) ? 6 : /[.?!]$/.test(c.text) ? 4 : /[,:]$/.test(c.text) ? 2 : 0;
    c.words = c.text.split(' ').map(w => w.replace(/[^A-Za-z']/g, '').toLowerCase());
    W += c.w + c.p;
  });
  let acc = 0; const dur = s.end - s.start;
  chunks.forEach(c => { c.t0 = s.start + dur * acc / W; acc += c.w + c.p; });
  const kw = (KEYWORDS[s.idx] || '').toLowerCase();
  let done = false;
  chunks.forEach(c => { c.kw = -1; if (!done) { const k = c.words.indexOf(kw); if (k >= 0) { c.kw = k; done = true; } } });
  s.chunks = chunks; s.emo = EMO[s.idx] || 'mystery';
}
SENT.forEach(buildWords);
const CUES = CUE_DEF.map(c => {
  if (c.t != null) return { t: c.t, fn: c.fn };
  const ch = SENT[c.s].chunks.find(x => x.words.includes(c.w)) || SENT[c.s].chunks[0];
  return { t: ch.t0, fn: c.fn };
}).sort((a, b) => a.t - b.t);

/* =====================================================================
   WEBAUDIO SFX ENGINE  (all synthesized, mixed low under narration)
   ===================================================================== */
const SFX = {
  ctx: null, out: null, noiseBuf: null, statGain: null, heartNext: 0,
  init() {
    if (this.ctx) return;
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const c = this.ctx = new C();
    this.out = c.createGain(); this.out.gain.value = .55; this.out.connect(c.destination);
    const len = c.sampleRate * 2, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = b;
    const src = c.createBufferSource(); src.buffer = b; src.loop = true;
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1400;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000;
    this.statGain = c.createGain(); this.statGain.gain.value = 0;
    src.connect(hp); hp.connect(lp); lp.connect(this.statGain); this.statGain.connect(this.out); src.start();
  },
  resume() { this.init(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend(); },
  ok() { return this.ctx && this.ctx.state === 'running'; },
  setStatic(l) { if (this.ctx) this.statGain.gain.setTargetAtTime(l * 0.05, this.ctx.currentTime, .2); },
  fire(name) { if (this.ok() && this[name]) this[name](); },
  /* clean metallic elevator bell */
  ding() {
    const c = this.ctx, t = c.currentTime, g = c.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.34, t + .006);
    g.gain.exponentialRampToValueAtTime(.0001, t + 2.4); g.connect(this.out);
    [[1, 1], [2.76, .42], [5.4, .2], [8.93, .08]].forEach(([m, a], i) => {
      const o = c.createOscillator(), og = c.createGain();
      o.type = 'sine'; o.frequency.value = 1174.7 * m;
      og.gain.setValueAtTime(a, t); og.gain.exponentialRampToValueAtTime(.0001, t + 2.4 / (1 + i * .9));
      o.connect(og); og.connect(g); o.start(t); o.stop(t + 2.5);
    });
  },
  /* two short vibration pulses */
  buzz() {
    const c = this.ctx, t0 = c.currentTime;
    [0, .3].forEach(dt => {
      const t = t0 + dt, g = c.createGain(), lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 800;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.26, t + .015);
      g.gain.setValueAtTime(.26, t + .19); g.gain.linearRampToValueAtTime(0, t + .24);
      const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 38; lg.gain.value = .12; lfo.connect(lg); lg.connect(g.gain);
      [['sawtooth', 170], ['square', 85]].forEach(([ty, f]) => {
        const o = c.createOscillator(); o.type = ty; o.frequency.value = f; o.connect(lp); o.start(t); o.stop(t + .26);
      });
      lp.connect(g); g.connect(this.out); lfo.start(t); lfo.stop(t + .26);
    });
  },
  thump(t, v) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(42, t + .12);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.001, t + .22);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + .25);
  },
  /* low double-thump heartbeat, speeds up with prog 0..1 */
  heartTick(on, prog) {
    if (!this.ok()) return;
    if (!on) { this.heartNext = 0; return; }
    const now = this.ctx.currentTime;
    if (this.heartNext === 0) this.heartNext = now + .05;
    if (now + .1 >= this.heartNext) {
      const t = Math.max(this.heartNext, now);
      this.thump(t, .75); this.thump(t + .19 - .06 * prog, .5);
      this.heartNext = t + 60 / lerp(62, 150, clamp(prog, 0, 1));
    }
  },
  /* deep low boom */
  boom(v = 1, len = 2.4) {
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(85, t); o.frequency.exponentialRampToValueAtTime(26, t + len * .75);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.95 * v, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + len);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t + len + .1);
    const n = c.createBufferSource(); n.buffer = this.noiseBuf;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 190;
    const ng = c.createGain(); ng.gain.setValueAtTime(.6 * v, t); ng.gain.exponentialRampToValueAtTime(.001, t + len * .45);
    n.connect(lp); lp.connect(ng); ng.connect(this.out); n.start(t); n.stop(t + len);
  },
  hit() { this.boom(.3, .9); }
};

/* =====================================================================
   SVG BUILDING BLOCKS - characters, faces, props, effects
   ===================================================================== */
const ST = `stroke="${INK}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"`;
const eyeW = (cx, cy, r, pr, px = 0, py = 0) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${INK}" stroke-width="4"/><circle cx="${cx + px}" cy="${cy + py}" r="${pr}" fill="${INK}"/>`;

  const a = n.a; let tr = '', op = null; const TAU = 6.2832;
  switch (a.t) {
    case 'bob': tr = `translate(0 ${(a.amp * Math.sin(bt * a.hz * TAU + (a.ph || 0))).toFixed(2)})`; break;
    case 'sway': tr = `rotate(${(a.amp * Math.sin(bt * a.hz * TAU + (a.ph || 0))).toFixed(2)} ${a.ox || 0} ${a.oy || 0})`; break;
    case 'breathe': { const s = Math.sin(bt * a.hz * TAU + (a.ph || 0)), ox = a.ox || 0, oy = a.oy || 0; tr = `translate(${ox} ${oy}) scale(${(1 - a.amp * .5 * s).toFixed(4)} ${(1 + a.amp * s).toFixed(4)}) translate(${-ox} ${-oy})`; break; }
    case 'pulse': { const s = 1 + a.amp * Math.sin(bt * a.hz * TAU + (a.ph || 0)), ox = a.ox || 0, oy = a.oy || 0; tr = `translate(${ox} ${oy}) scale(${s.toFixed(4)}) translate(${-ox} ${-oy})`; break; }
    case 'trem': if (a.amp) { const x = (Math.sin(bt * a.hz * 7.1 + 1.3) + Math.sin(bt * a.hz * 11.3)) * a.amp * .5, y = (Math.sin(bt * a.hz * 9.7 + .4) + Math.sin(bt * a.hz * 5.9)) * a.amp * .5; tr = `translate(${x.toFixed(2)} ${y.toFixed(2)})`; } break;
    case 'drift': tr = `translate(${(a.vx * bt).toFixed(2)} ${(a.vy * bt).toFixed(2)})`; break;
    case 'spin': tr = `rotate(${(a.dps * bt).toFixed(2)} ${a.ox} ${a.oy})`; break;
    case 'wob': tr = `rotate(${(Math.floor(bt * a.hz) % 2 ? a.amp : -a.amp)} ${a.ox} ${a.oy})`; break;
    case 'flick': { const v = Math.sin(bt * a.hz * 9.1 + a.seed * 3.7) * Math.sin(bt * a.hz * 23.3 + a.seed); op = v > .8 ? a.lo : a.hi; break; }
    case 'blink': op = Math.floor(bt * a.hz * 2) % 2 ? .15 : 1; break;
    case 'show': op = (bt >= a.t0 && (a.t1 == null || bt < a.t1)) ? 1 : 0; break;
    case 'rot': { const k = clamp((bt - a.t0) / (a.t1 - a.t0), 0, 1); tr = `rotate(${lerp(a.a0, a.a1, ease(k)).toFixed(2)} ${a.ox} ${a.oy})`; break; }
    case 'pop': {
      const k = (bt - a.t0) / (a.d || .3), ox = a.ox || 0, oy = a.oy || 0;
      if (k < 0) { op = 0; tr = `translate(${ox} ${oy}) scale(0) translate(${-ox} ${-oy})`; }
      else { const s = outBack(Math.min(k, 1)); tr = `translate(${ox} ${oy}) scale(${s.toFixed(3)}) translate(${-ox} ${-oy})`; op = a.t1 != null && bt > a.t1 ? clamp(1 - (bt - a.t1) / .2, 0, 1) : 1; }
      break;
    }
    case 'grow': { const k = ((bt * a.hz + (a.ph || 0)) % 1 + 1) % 1, s = lerp(a.s0, a.s1, k); tr = `translate(${a.ox} ${a.oy}) scale(${s.toFixed(3)}) translate(${-a.ox} ${-a.oy})`; op = ((a.op || 1) * (1 - k) * Math.min(1, k * 8)).toFixed(3); break; }
    case 'fall': { const y = ((a.y0 + a.v * bt) % a.span + a.span) % a.span; tr = `translate(${(a.sw * Math.sin(bt * a.hz * TAU + a.ph)).toFixed(1)} ${(y - a.y0).toFixed(1)})`; break; }
    case 'drip': { const k = ((bt * a.v + a.ph) % 1 + 1) % 1; tr = `translate(0 ${(k * a.dist).toFixed(1)})`; op = (1 - k * k).toFixed(2); break; }
    case 'rise': { const k = ((bt * a.v + a.ph) % 1 + 1) % 1; tr = `translate(${(Math.sin(bt * 3 + a.ph * 6) * a.sw).toFixed(1)} ${(-k * a.dist).toFixed(1)})`; op = (k < .15 ? k / .15 : (1 - k) / .85).toFixed(2); break; }
  }
  if (tr) n.el.setAttribute('transform', tr);
  if (op !== null) n.el.setAttribute('opacity', op);
}
function buildBeat(beat) {
  UID = 0;
  content.innerHTML = beat.build(beat);
  nodes = [...content.querySelectorAll('[data-a]')].map(el => ({ el, a: JSON.parse(el.getAttribute('data-a')) }));
  tagEl.innerHTML = beat.tag ? `<span class="${beat.tag.blink ? 'blink' : ''}" style="background:${beat.tag.c}">${esc(beat.tag.text)}</span>` : '';
  hudEl.style.display = beat.cctv ? 'block' : 'none';
}
function clockStr(t) {
  const base = t < 51.67 ? 3 * 3600 + 31 * 60 + t : 3 * 3600 + 33 * 60 + (t - 51.67);
  return `${pad(Math.floor(base / 3600))}:${pad(Math.floor(base / 60) % 60)}:${pad(Math.floor(base) % 60)}:${pad(Math.floor((base % 1) * 24))}`;
}
/* noise canvas (CCTV static / film grain) */
const nctx = noiseEl.getContext('2d'), nimg = nctx.createImageData(108, 192); let lastNoise = 0;
function drawNoise(ts) {
  if (ts - lastNoise < 60) return; lastNoise = ts;
  const d = nimg.data;
  for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  nctx.putImageData(nimg, 0, 0);
}
/* captions */
function setCaption(s, ci) {
  if (!s || ci < 0) { capEl.innerHTML = ''; return; }
  const c = s.chunks[ci], col = EMO_COL[s.emo], glow = EMO_GLOW[s.emo];
  const words = c.text.split(' ').map((w, k) => `<span${k === c.kw ? ' class="lime"' : ''}>${esc(w)}</span>`).join('');
  const r = ((Math.sin(s.idx * 7 + ci * 13) * 3).toFixed(1));
  capEl.innerHTML = `<div class="w" style="color:${col};--r:${r}deg;filter:drop-shadow(0 0 22px ${glow}aa)">${words}</div>`;
  const el = capEl.firstChild, w = el.offsetWidth;
  if (w > 1000) el.style.fontSize = (150 * 1000 / w).toFixed(0) + 'px';
}
function setSubtitle(s) {
  if (!s) { subEl.innerHTML = ''; return; }
  subEl.innerHTML = '<p>' + s.chunks.map((c, i) => `<span class="c" data-i="${i}">${c.text.split(' ').map((w, k) => k === c.kw ? `<span class="lime">${esc(w)}</span>` : esc(w)).join(' ')}</span>`).join(' ') + '</p>';
}
function markSubtitle(ci) {
  subEl.querySelectorAll('.c').forEach(e => { const i = +e.dataset.i; e.className = 'c' + (i < ci ? ' done' : i === ci ? ' cur' : ''); });
}
function sceneAt(t) { let r = SC[0]; for (const s of SC) if (t >= s.start) r = s; return r; }

function render(ts) {
  const sc = sceneAt(T);
  if (sc !== curScene) { curScene = sc; labelEl.innerHTML = `<i></i>${esc(sc.label)}`; labelEl.classList.remove('pop'); void labelEl.offsetWidth; labelEl.classList.add('pop'); }
  const beats = sc.beats; let bi = 0;
  for (let i = 0; i < beats.length; i++) if (T >= beats[i].t) bi = i;
  const beat = beats[bi];
  if (beat !== curBeat) { curBeat = beat; buildBeat(beat); }
  const dur = Math.max(.01, beat.end - beat.t); let bt = Math.max(0, T - beat.t);
  if (beat.slow) { const [a, b, r] = beat.slow; bt = bt < a ? bt : bt <= b ? a + (bt - a) * r : a + (b - a) * r + (bt - b); }
  for (const n of nodes) applyAnim(n, bt);
  /* camera */
  const c = beat.cam || { z0: 1, z1: 1, fx: 540, fy: 960 }, k = clamp((T - beat.t) / dur, 0, 1);
  const z = lerp(c.z0, c.z1, ease(k)), ax = c.ax != null ? c.ax : c.fx, ay = c.ay != null ? c.ay : c.fy;
  let sx = 0, sy = 0;
  if (beat.shake) { const lt = T - beat.t, sh = beat.shake; if ((sh.from == null || lt >= sh.from) && (sh.until == null || lt < sh.until)) { sx = Math.sin(T * 91) * sh.amp; sy = Math.cos(T * 77) * sh.amp; } }
  camG.setAttribute('transform', `translate(${(ax + sx).toFixed(1)} ${(ay + sy).toFixed(1)}) scale(${z.toFixed(4)}) translate(${-c.fx} ${-c.fy})`);
  /* overlays */
  const v = beat.vig || { c: '#000', a: .55, hz: 0 };
  vigEl.style.setProperty('--vc', v.c);
  vigEl.style.opacity = v.hz ? (v.a * (.55 + .45 * Math.sin(T * v.hz * 6.2832))).toFixed(3) : v.a;
  flashEl.style.opacity = beat.flash ? (beat.flash * clamp(1 - (T - beat.t) / .14, 0, 1)).toFixed(3) : 0;
  noiseEl.style.opacity = beat.noise != null ? beat.noise : .06;
  scanEl.style.opacity = beat.cctv || beat.static >= 1 ? .55 : 0;
  if (beat.cctv) $('tc').textContent = clockStr(T);
  $('rec').style.opacity = Math.floor(T * 2) % 2 ? .25 : 1;
  /* end card */
  const showEnd = T >= SPEECH_END;
  if (showEnd !== endShown) {
    endShown = showEnd; endEl.style.display = showEnd ? 'flex' : 'none';
    if (showEnd) endEl.innerHTML = `<div class="q">DO YOU TAKE THE <span style="color:#ffd66b">STAIRS</span> FOREVER?</div><div class="or">- OR -</div><div class="q">DO YOU <span style="color:#ff4a4a">RIDE</span> IT DOWN?</div><div class="cta">COMMENT YOUR ANSWER</div>`;
  }
  labelEl.style.display = showEnd ? 'none' : 'block';
  /* captions: exact sentence windows, word-by-word inside */
  let s = null; for (const x of SENT) if (T >= x.start && T < x.end + .18) { s = x; break; }
  if (s !== curSent) { curSent = s; curChunk = -2; setSubtitle(s); }
  let ci = -1; if (s) for (let i = 0; i < s.chunks.length; i++) if (T >= s.chunks[i].t0) ci = i;
  if (ci !== curChunk) { curChunk = ci; setCaption(s, ci); if (s) markSubtitle(ci); }
  /* sfx state + cues */
  if (playing) {
    SFX.setStatic(beat.static || 0);
    SFX.heartTick(sc.heart, (T - sc.start) / (sc.end - sc.start));
    if (T > lastT && T - lastT < .5) for (const q of CUES) if (q.t > lastT && q.t <= T) SFX.fire(q.fn);
  }
  lastT = T;
  /* progress */
  const pr = T / TOTAL * 100; $('fill').style.width = pr + '%'; $('knob').style.left = pr + '%';
  $('tm').textContent = `${Math.floor(T / 60)}:${pad(Math.floor(T % 60))} / ${Math.floor(TOTAL / 60)}:${pad(Math.floor(TOTAL % 60))}`;
  drawNoise(ts);
}

/* ---------------- transport ---------------- */
function setUI() { $('pp').innerHTML = playing ? '&#10074;&#10074;' : '&#9654;'; overlay.style.display = playing ? 'none' : 'flex'; }
function play() {
  if (T >= TOTAL - .05) seek(0);
  SFX.resume(); playing = true; lastReal = performance.now(); lastT = T;
  if (audioOK && T < (isFinite(aud.duration) ? aud.duration : 1e9) - .05) { aud.currentTime = T; const pr = aud.play(); if (pr && pr.catch) pr.catch(() => { audioOK = false; $('nt').style.display = 'block'; }); }
  setUI();
}
function pause() { playing = false; aud.pause(); SFX.suspend(); setUI(); }
function seek(t) {
  T = clamp(t, 0, TOTAL); lastT = T; SFX.heartNext = 0;
  if (audioOK && isFinite(aud.duration) && T < aud.duration) { try { aud.currentTime = T; } catch (e) { } if (playing && aud.paused) aud.play().catch(() => { }); }
}
function toggle() { playing ? pause() : play(); }
function frame(ts) {
  const dt = Math.min(.1, (ts - lastReal) / 1000); lastReal = ts;
  if (playing) {
    if (audioOK && !aud.paused && !aud.ended) T = aud.currentTime; else T += dt;
    if (T >= TOTAL) { T = TOTAL; pause(); }
  }
  render(ts);
  requestAnimationFrame(frame);
}
$('pp').addEventListener('click', toggle);
overlay.addEventListener('click', toggle);
stage.addEventListener('click', e => { if (!e.target.closest('#overlay')) toggle(); });
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } if (e.code === 'ArrowRight') seek(T + 5); if (e.code === 'ArrowLeft') seek(T - 5); });
let drag = false; const bar = $('bar');
const barSeek = e => { const r = bar.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * TOTAL); };
bar.addEventListener('pointerdown', e => { drag = true; bar.setPointerCapture(e.pointerId); barSeek(e); });
bar.addEventListener('pointermove', e => { if (drag) barSeek(e); });
bar.addEventListener('pointerup', () => { drag = false; });

/* scale 1080x1920 stage to fit the window */
function fit() {
  const availH = window.innerHeight - 64, sc = Math.min(window.innerWidth / 1080, availH / 1920);
  stage.style.transform = `scale(${sc})`; wrap.style.width = 1080 * sc + 'px'; wrap.style.height = 1920 * sc + 'px';
  $('controls').style.width = Math.max(280, 1080 * sc) + 'px';
}
window.addEventListener('resize', fit); fit();
setUI(); requestAnimationFrame(frame);
</script>
