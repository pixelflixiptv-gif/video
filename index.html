<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Ghost Ship - Mary Celeste | Animated Mystery</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#04060c;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#view{flex:1;min-height:0;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 40%,#101a33,#04060c 70%)}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;margin:-960px 0 0 -540px;transform-origin:50% 50%;background:#000;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.8)}
#sceneWrap{position:absolute;inset:0;will-change:transform,filter}
#svg{position:absolute;left:0;top:0;width:1080px;height:1920px;display:block}
#streaks{position:absolute;inset:0;pointer-events:none;opacity:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 18px,rgba(255,255,255,.55) 18px 22px,rgba(255,255,255,0) 22px 61px,rgba(255,255,255,.35) 61px 63px,rgba(255,255,255,0) 63px 97px)}
/* HUD */
#banner{position:absolute;left:0;top:0;width:1080px;height:140px;background:linear-gradient(#e4232f,#a90e18);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(0,0,0,.55);z-index:20}
#banner::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:repeating-linear-gradient(90deg,#fff 0 26px,#c0121c 26px 52px);opacity:.92}
#banner::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,0))}
#banner span{position:relative;font:900 60px/1 Impact,"Arial Black","Helvetica Neue",sans-serif;letter-spacing:3px;color:#fff;text-shadow:0 5px 0 #5a050b,0 0 18px rgba(0,0,0,.45);white-space:nowrap;display:inline-block}
#sceneLabel{position:absolute;left:28px;top:172px;z-index:20;display:flex;align-items:center;gap:14px;height:62px;padding:0 26px 0 8px;border-radius:40px;background:rgba(6,10,22,.72);border:3px solid rgba(255,255,255,.25);font:900 30px/1 Impact,"Arial Black",sans-serif;letter-spacing:2px;max-width:820px;white-space:nowrap;text-shadow:0 2px 0 #000}
#sceneLabel .num{background:#b6ff2e;color:#0b1a05;border-radius:30px;min-width:48px;height:46px;display:flex;align-items:center;justify-content:center;padding:0 12px;text-shadow:none}
#sceneLabel.chg{animation:slideR .45s cubic-bezier(.2,1.2,.4,1) both}
#timeChip{position:absolute;right:28px;top:172px;z-index:20;height:62px;padding:0 24px;border-radius:40px;background:rgba(6,10,22,.72);border:3px solid rgba(255,255,255,.25);display:flex;align-items:center;font:900 30px/1 Impact,"Arial Black",sans-serif;letter-spacing:2px;color:#ffe45e;text-shadow:0 2px 0 #000}
#cap{position:absolute;left:0;top:1292px;width:1080px;height:330px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:20}
.w{display:inline-block;white-space:nowrap;font:900 210px/1 Impact,"Arial Black","Helvetica Neue",sans-serif;text-transform:uppercase;color:#fff;-webkit-text-stroke:18px #000;paint-order:stroke fill;text-shadow:0 10px 0 #000,0 0 36px rgba(0,0,0,.7);letter-spacing:2px;transform:rotate(var(--rot,0deg));animation:wpop .26s cubic-bezier(.2,1.5,.4,1) both}
.w.k{color:#b6ff2e;text-shadow:0 10px 0 #000,0 0 46px rgba(150,255,0,.85)}
.w.d{color:#ff3b30;text-shadow:0 10px 0 #000,0 0 46px rgba(255,40,30,.8)}
.w.f{color:#cfeaff;text-shadow:0 10px 0 #000,0 0 46px rgba(120,200,255,.85)}
.w.m{color:#ffd36b;text-shadow:0 10px 0 #000,0 0 46px rgba(255,190,70,.8)}
@keyframes wpop{0%{transform:rotate(var(--rot,0deg)) scale(.6);opacity:0}55%{transform:rotate(var(--rot,0deg)) scale(1.05);opacity:1}100%{transform:rotate(var(--rot,0deg)) scale(1);opacity:1}}
#sub{position:absolute;left:50px;top:1672px;width:980px;text-align:center;z-index:20;font:800 47px/1.24 system-ui,"Segoe UI",Arial,sans-serif;color:#fff;text-shadow:0 3px 0 #000,0 0 10px #000;background:rgba(0,0,0,.52);border-radius:30px;padding:18px 28px;display:none}
#sub i{font-style:normal;opacity:.62}
#sub i.on{opacity:1;color:#ffe45e}
#startOv{position:absolute;inset:0;z-index:50;background:rgba(2,4,10,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;cursor:pointer}
#startOv .big{width:300px;height:300px;border-radius:50%;background:#b6ff2e;border:12px solid #000;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 14px rgba(182,255,46,.3),0 20px 60px rgba(0,0,0,.6);animation:pulse 1.4s ease-in-out infinite}
#startOv .big::after{content:"";border-left:110px solid #0b1a05;border-top:70px solid transparent;border-bottom:70px solid transparent;margin-left:28px}
#startOv h2{font:900 84px/1 Impact,"Arial Black",sans-serif;letter-spacing:4px;text-shadow:0 6px 0 #000;text-align:center}
#startOv p{font:700 38px/1.3 system-ui,sans-serif;opacity:.85;text-align:center;max-width:820px}
#stage.paused #svg *{animation-play-state:paused!important}
/* controls */
#controls{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px;background:#0a0f1d;border-top:1px solid #1d2742;min-height:64px}
#btnPlay{width:46px;height:46px;border-radius:50%;border:0;background:#b6ff2e;color:#0b1a05;font-size:20px;font-weight:900;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
#btnPlay:hover{filter:brightness(1.1)}
#prog{position:relative;flex:1;height:16px;border-radius:10px;background:#1b2440;cursor:pointer;min-width:80px}
#progFill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:10px;background:linear-gradient(90deg,#e4232f,#ff7b52)}
#prog .mk{position:absolute;top:-4px;bottom:-4px;width:3px;background:#fff;opacity:.55;border-radius:2px}
#prog .mk.sp{background:#ffe45e;opacity:.9}
#progKnob{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;border:3px solid #e4232f;left:0}
#tTxt{font:700 15px/1 ui-monospace,Menlo,Consolas,monospace;color:#9fb0d6;white-space:nowrap;flex:0 0 auto;min-width:96px;text-align:right}
#jumps{display:flex;gap:6px;flex:0 0 auto}
#jumps button{height:34px;min-width:34px;padding:0 10px;border-radius:17px;border:1px solid #2c3a63;background:#131c36;color:#cdd8f5;font:700 13px system-ui;cursor:pointer}
#jumps button:hover{background:#1f2c52}
#jumps button.ph{border-style:dashed;color:#8a97bd}
#jumps button.on{background:#b6ff2e;color:#0b1a05;border-color:#b6ff2e}
@media (max-width:640px){#jumps{display:none}}

/* ===== keyframes (all seekable via Web Animations currentTime) ===== */
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.07);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes popOut{0%{transform:scale(1);opacity:1}100%{transform:scale(.2);opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes slideUp{from{transform:translateY(110px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideDown{from{transform:translateY(-110px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideL{from{transform:translateX(220px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-220px);opacity:0}to{transform:none;opacity:1}}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(var(--dx,-30px),var(--dy,0px),0)}}
@keyframes bob{0%{transform:translateY(-9px) rotate(-.7deg)}100%{transform:translateY(9px) rotate(.7deg)}}
@keyframes rock{0%{transform:rotate(-8deg)}100%{transform:rotate(8deg)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.022)}}
@keyframes headBob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes billow{0%{transform:scaleX(.955)}100%{transform:scaleX(1.05)}}
@keyframes flap{0%{transform:skewY(-7deg) scaleX(1)}100%{transform:skewY(9deg) scaleX(.86)}}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-5px,3px)}50%{transform:translate(4px,-3px)}75%{transform:translate(-3px,-4px)}}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinStep{0%{transform:rotate(0)}100%{transform:rotate(5deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes ping{0%{transform:scale(.2);opacity:.95}100%{transform:scale(2.6);opacity:0}}
@keyframes sweat{0%{transform:translateY(-8px);opacity:0}20%{opacity:1}100%{transform:translateY(40px);opacity:0}}
@keyframes dash{to{stroke-dashoffset:-72}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes burst{0%{transform:scale(.1) rotate(-14deg);opacity:1}30%{transform:scale(1.15) rotate(3deg);opacity:1}100%{transform:scale(1.35) rotate(5deg);opacity:0}}
@keyframes slam{0%{transform:scale(3.4) rotate(-14deg);opacity:0}50%{transform:scale(.9) rotate(-8deg);opacity:1}72%{transform:scale(1.07) rotate(-8deg)}100%{transform:scale(1) rotate(-8deg);opacity:1}}
@keyframes rise{0%{transform:translateY(40px) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-230px) scale(1.1);opacity:0}}
@keyframes mote{0%{transform:translate(0,0);opacity:0}18%{opacity:.85}100%{transform:translate(var(--dx,40px),var(--dy,-120px));opacity:0}}
@keyframes swing{0%{transform:rotate(-13deg)}100%{transform:rotate(13deg)}}
@keyframes waveX{from{transform:translateX(0)}to{transform:translateX(var(--sh,-540px))}}
@keyframes vigPulse{0%,100%{opacity:.12}50%{opacity:.85}}
@keyframes visOn{from{opacity:0}to{opacity:1}}
@keyframes visOff{from{opacity:1}to{opacity:0}}
@keyframes ref{from{opacity:0}to{opacity:0}}
@keyframes spark{0%{transform:scale(0) rotate(0)}50%{transform:scale(1) rotate(45deg)}100%{transform:scale(0) rotate(90deg)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes flicker{0%,100%{opacity:1}42%{opacity:.82}50%{opacity:.5}58%{opacity:.92}}
@keyframes cloud{from{transform:translateX(-50px)}to{transform:translateX(70px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes zoomSlow{from{transform:scale(1)}to{transform:scale(1.12)}}
@keyframes steam{0%{transform:translateY(0) scaleX(1);opacity:0}25%{opacity:.7}100%{transform:translateY(-70px) scaleX(1.6);opacity:0}}
@keyframes ghostFloat{0%{transform:translate(0,0)}100%{transform:translate(26px,-40px)}}
@keyframes fogMove{from{transform:translateX(-120px)}to{transform:translateX(120px)}}
@keyframes ticker{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes dingSwing{0%{transform:rotate(0)}12%{transform:rotate(17deg)}30%{transform:rotate(-13deg)}48%{transform:rotate(9deg)}64%{transform:rotate(-5deg)}80%{transform:rotate(2.5deg)}100%{transform:rotate(0)}}
@keyframes cta{0%,100%{transform:translateY(0)}50%{transform:translateY(22px)}}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="stage" class="paused">
      <div id="sceneWrap">
        <svg id="svg" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="gVig" cx=".5" cy=".5" r=".75"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></radialGradient>
            <radialGradient id="gVigRed" cx=".5" cy=".5" r=".75"><stop offset=".4" stop-color="#c8001a" stop-opacity="0"/><stop offset="1" stop-color="#c8001a" stop-opacity=".9"/></radialGradient>
            <radialGradient id="gVigBlue" cx=".5" cy=".5" r=".75"><stop offset=".4" stop-color="#0a3c9c" stop-opacity="0"/><stop offset="1" stop-color="#0a2c7c" stop-opacity=".9"/></radialGradient>
            <radialGradient id="gSun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd596" stop-opacity=".95"/><stop offset=".5" stop-color="#ff9d6c" stop-opacity=".35"/><stop offset="1" stop-color="#ff9d6c" stop-opacity="0"/></radialGradient>
            <radialGradient id="gGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
            <radialGradient id="gGlowG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#b6ff2e" stop-opacity=".9"/><stop offset="1" stop-color="#b6ff2e" stop-opacity="0"/></radialGradient>
            <radialGradient id="gGlowY" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd36b" stop-opacity=".95"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
            <linearGradient id="gSail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7edd3"/><stop offset="1" stop-color="#d8c79f"/></linearGradient>
            <linearGradient id="gShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></linearGradient>
            <linearGradient id="gFog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe9ee" stop-opacity="0"/><stop offset=".5" stop-color="#cfe9ee" stop-opacity=".38"/><stop offset="1" stop-color="#cfe9ee" stop-opacity="0"/></linearGradient>
            <linearGradient id="gParch" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3e3b8"/><stop offset="1" stop-color="#d8bd83"/></linearGradient>
          </defs>
          <g id="cam">
            <g id="bg"></g><g id="mid"></g><g id="fg"></g><g id="lab"></g>
          </g>
          <g id="ov"></g>
          <rect width="1080" height="1920" fill="url(#gVig)" opacity=".55" pointer-events="none"/>
        </svg>
      </div>
      <div id="streaks"></div>
      <div id="banner"><span id="bannerTxt">THE GHOST SHIP - MARY CELESTE</span></div>
      <div id="sceneLabel"><span class="num" id="slNum">01</span><span id="slTxt">DECEMBER 1872 - ATLANTIC OCEAN</span></div>
      <div id="timeChip">0:00</div>
      <div id="cap"></div>
      <div id="sub"></div>
      <div id="startOv"><div class="big"></div><h2>TAP TO PLAY</h2><p>Narration + synthesized sound effects. Turn your sound on.</p></div>
    </div>
  </div>
  <div id="controls">
    <button id="btnPlay" title="Play / Pause (space)">&#9654;</button>
    <div id="prog"><div id="progFill"></div><div id="progKnob"></div></div>
    <div id="tTxt">0:00 / 1:51</div>
    <div id="jumps"></div>
  </div>
</div>
<script>
(function(){
'use strict';
/* =====================================================================
   THE GHOST SHIP - MARY CELESTE  |  single-file animated video
   STEP 1: framework + scenes 1-2 animated, scenes 3-5 = placeholders,
           end card in the silent tail.
   Sections:  1 DATA  2 CLOCK/AUDIO  3 SFX  4 KIT  5 ART  6 SCENES  7 ENGINE  8 UI
   ===================================================================== */

/* ===== 1. SCRIPT DATA - EXACT sentence timings from script.txt ===== */
const TOTAL=111.10, SPEECH_END=105.90;
const L=(s,e,text,key,emo)=>({s,e,text,key:key||'',emo:emo||{}});
const LINES=[
 // [DECEMBER 1872 - ATLANTIC OCEAN]
 L(0.00,4.01,'A ship is drifting... in the middle of the Atlantic Ocean.','drifting',{atlantic:'f'}),
 L(4.39,7.22,'Sails set. Cargo untouched.','untouched'),
 L(7.60,10.55,'But the crew?... Gone. All ten of them.','crew',{gone:'d',ten:'d'}),
 L(10.93,15.85,'This is the Mary Celeste. The most famous ghost ship in history.','ghost'),
 L(16.23,19.69,'And to this day... nobody knows what happened.','nobody',{happened:'f'}),
 // [THE DISCOVERY]
 L(20.54,25.89,'Another ship found her, drifting, on December 4th, 1872.','found'),
 L(26.27,29.77,'They climbed aboard... and called out. Silence.','aboard',{silence:'f'}),
 L(30.15,34.86,'The only lifeboat was missing. Everything else... was still there.','lifeboat',{missing:'d'}),
 L(35.24,40.64,'Food for six months. And 1,700 barrels of cargo.','1,700',{food:'m',six:'m',months:'m'}),
 // [THE CAPTAIN]
 L(41.49,44.32,'Captain Benjamin Briggs was no amateur.','Briggs'),
 L(44.70,48.95,'He was careful. Experienced. Trusted by everyone.','Trusted',{careful:'m'}),
 L(49.33,54.92,'With him were his wife... and their little girl. Just two years old.','two',{wife:'m',little:'m',girl:'m'}),
 L(55.30,58.47,'The last log entry was written on November 25th.','log'),
 L(58.85,62.18,'Rough weather. Nothing more. No fear. No warning.','warning',{rough:'d',fear:'f'}),
 // [THE THEORIES]
 L(63.03,66.99,'Pirates? Nothing was stolen. Not even the crew\'s clothes.','stolen',{pirates:'d'}),
 L(67.37,71.07,'A storm? The ship survived it... so why abandon her?','abandon',{storm:'d'}),
 L(71.45,76.15,'Poisoned food? A mutiny? A waterspout at midnight?','mutiny',{poisoned:'d',midnight:'f'}),
 L(76.53,80.71,'Every theory explains one thing... and breaks on another.','breaks'),
 // [THE QUESTION]
 L(81.56,87.97,'Ten people stepped into a small boat... in the middle of an ocean.','boat',{ten:'f'}),
 L(88.35,92.09,'Why would a careful captain... do that?','captain'),
 L(92.47,96.00,'The boat was never found. Neither were they.','never'),
 L(96.38,101.56,'150 years later... the sea is still keeping its secret.','secret',{'150':'f'}),
 L(101.94,105.90,'What do YOU think happened... to the Mary Celeste?','YOU'),
];
const norm=w=>w.toLowerCase().replace(/[^a-z0-9]/g,'');
/* word-by-word chunks: time inside the sentence window is split proportionally
   to word length, with extra weight for punctuation pauses. Tiny words merge with the next word. */
LINES.forEach(line=>{
  const words=line.text.split(/\s+/); line.words=words;
  const wt=words.map(w=>{let n=norm(w).length+1.6; if(/\.\.\.$|…$/.test(w)) n+=6; else if(/[.?!]$/.test(w)) n+=3; else if(/,$/.test(w)) n+=2; return n;});
  const ch=[]; let i=0;
  while(i<words.length){ let j=i; while(j<words.length-1&&norm(words[j]).length<=2&&!/[.?!,]$/.test(words[j])) j++; ch.push({i0:i,i1:j}); i=j+1; }
  const tot=wt.reduce((a,b)=>a+b,0), dur=line.e-line.s; let acc=0, keyDone=false;
  ch.forEach(c=>{
    let w=0; for(let k=c.i0;k<=c.i1;k++) w+=wt[k];
    c.t0=line.s+acc/tot*dur; acc+=w; c.t1=line.s+acc/tot*dur;
    c.text=words.slice(c.i0,c.i1+1).join(' '); c.cls='';
    for(let k=c.i0;k<=c.i1;k++){ if(!keyDone&&norm(words[k])===norm(line.key)){c.cls='k';keyDone=true;} }
    if(!c.cls) for(let k=c.i0;k<=c.i1;k++){ const e=line.emo[norm(words[k])]; if(e){c.cls=e;break;} }
  });
  line.chunks=ch;
});

/* ===== 2. CLOCK / AUDIO (narration.mp3 drives the timeline) ===== */
const $=s=>document.querySelector(s);
const SRCS=['narration.mp3','https://raw.githubusercontent.com/pixelflixiptv-gif/video/main/narration.mp3'];
const audio=new Audio(); audio.preload='auto'; let srcTry=0, audioOK=true;
audio.src=SRCS[0];
audio.addEventListener('error',()=>{
  if(srcTry<SRCS.length-1){ srcTry++; audio.src=SRCS[srcTry]; audio.load(); if(playing) audio.play().catch(()=>{audioOK=false;}); }
  else { audioOK=false; const n=$('#sub'); console.warn('narration.mp3 unavailable - running silent timeline'); }
});
let playing=false, cur=0, t0=0, wall0=0, prevT=0;
let audioNoSeek=false;
const audioActive=()=>audioOK&&!audioNoSeek&&!audio.paused&&!audio.ended;
audio.addEventListener('ended',()=>{ t0=Math.min(audio.duration||TOTAL,TOTAL); cur=t0; wall0=performance.now(); });

/* ===== 3. WEBAUDIO SFX ENGINE (everything synthesized, mixed LOW) ===== */
const SFX=(function(){
  let ctx=null,master=null,white=null,brown=null,wavesOn=false;
  const rn=(a,b)=>a+Math.random()*(b-a);
  function init(){
    if(ctx) return true;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    ctx=new AC(); master=ctx.createGain(); master.gain.value=.5;
    const comp=ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
    const len=ctx.sampleRate*3;
    white=ctx.createBuffer(1,len,ctx.sampleRate); brown=ctx.createBuffer(1,len,ctx.sampleRate);
    const dw=white.getChannelData(0), db=brown.getChannelData(0); let last=0;
    for(let i=0;i<len;i++){ const w=Math.random()*2-1; dw[i]=w; last=(last+.02*w)/1.02; db[i]=last*3.5; }
    return true;
  }
  const nsrc=(buf,loop)=>{const s=ctx.createBufferSource(); s.buffer=buf; s.loop=!!loop; return s;};
  const biq=(type,f,q)=>{const b=ctx.createBiquadFilter(); b.type=type; b.frequency.value=f; if(q!=null) b.Q.value=q; return b;};
  const gain=v=>{const g=ctx.createGain(); g.gain.value=v; return g;};
  const osc=(type,f)=>{const o=ctx.createOscillator(); o.type=type; o.frequency.value=f; return o;};
  const ok=()=>ctx&&ctx.state==='running';
  /* ocean waves: slow filtered-noise swells under the whole video, very low */
  function startWaves(){
    if(wavesOn||!ctx) return; wavesOn=true; const t=ctx.currentTime;
    const s=nsrc(brown,true), lp=biq('lowpass',430,.7), g=gain(.085);

function hud(t,b){
  const si=SCENES.indexOf(b.scene), sc=b.scene;
  if(si!==hudScene){ hudScene=si; slNum.textContent=sc.end?'END':String(sc.id).padStart(2,'0'); slTxt.textContent=sc.title;
    slBox.classList.remove('chg'); void slBox.offsetWidth; slBox.classList.add('chg');
    [].forEach.call(jumps.children,(el,k)=>el.classList.toggle('on',k===si)); }
  const sec=Math.floor(t); if(sec!==hudSec){ hudSec=sec; tChip.textContent=fmt(t); tTxt.textContent=fmt(t)+' / '+fmt(TOTAL); }
  const pct=Math.round(t/TOTAL*2000)/20; if(pct!==hudPct){ hudPct=pct; progFill.style.width=pct+'%'; progKnob.style.left=pct+'%'; }
}
/* ---- KINETIC CAPTIONS (word by word) + subtitle line, EXACT sentence windows from script.txt ---- */
const capEl=$('#cap'), subEl=$('#sub'); let capLine=-1, capChunk=-1, subLine=-1;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function captions(t){
  let li=-1; for(let i=0;i<LINES.length;i++){ const l=LINES[i]; if(t>=l.s-.02&&t<=l.e+.22){ li=i; break; } }
  if(li<0){ if(capLine!==-1||subLine!==-1){ capEl.innerHTML=''; subEl.style.display='none'; capLine=capChunk=subLine=-1; } return; }
  const line=LINES[li]; let ci=0; for(let c=0;c<line.chunks.length;c++) if(t>=line.chunks[c].t0-.001) ci=c;
  if(li!==subLine){ subLine=li; subEl.style.display='block'; subEl.innerHTML=line.words.map((w,k)=>`<i>${esc(w)}</i>`).join(' '); capLine=-1; }
  if(li!==capLine||ci!==capChunk){
    capLine=li; capChunk=ci; const ch=line.chunks[ci];
    capEl.innerHTML=''; const sp=document.createElement('span'); sp.className='w'+(ch.cls?' '+ch.cls:''); sp.textContent=ch.text;
    sp.style.setProperty('--rot',(((li*7+ci*13)%5)-2)*1.4+'deg'); capEl.appendChild(sp);
    if(sp.offsetWidth>960) sp.style.fontSize=(210*960/sp.offsetWidth)+'px';
    [].forEach.call(subEl.children,(el,k)=>el.classList.toggle('on',k>=ch.i0&&k<=ch.i1));
  }
}
function render(t,force){
  const i=findBeat(t), b=BEATS[i];
  if(i!==curBeat||force) enter(i,t);
  const lt=t-b.a, at=animTime(b,lt);
  if(refAnim&&Math.abs(refAnim.currentTime-at*1000)>170) syncAnims(b,lt);   // keep css animations locked to narration
  if(b.slow){ const r=(lt>=b.slow[0]&&lt<b.slow[1])?b.slow[2]:1; if(r!==lastRate){ lastRate=r; anims.forEach(a=>{ try{a.playbackRate=r;}catch(e){} }); } } // slow-motion moment
  camera(b,at); counters(lt); transition(t); hud(t,b); captions(t);
}
function fire(a,b){ if(b<=a||b-a>1) return; for(let i=0;i<EVENTS.length;i++){ const e=EVENTS[i]; if(e.t>b) break; if(e.t>a) SFX.play(e.n,e.v,e.x); } }

/* ===== 8. UI: play/pause, progress, jumps, scaling ===== */
const btn=$('#btnPlay'), startOv=$('#startOv'), prog=$('#prog');
function setPlaying(on){
  if(on===playing) return; playing=on; stage.classList.toggle('paused',!on); btn.innerHTML=on?'&#10074;&#10074;':'&#9654;';
  if(on){
    startOv.style.display='none'; SFX.resume(); t0=cur; wall0=performance.now(); prevT=cur;
    if(audioOK&&!audioNoSeek){ try{ if(Math.abs(audio.currentTime-cur)>.08) audio.currentTime=cur; }catch(e){}
      const p=audio.play(); if(p&&p.catch) p.catch(e=>{ if(e&&e.name==='NotSupportedError') audioOK=false; }); }
  } else { audio.pause(); SFX.suspend(); }
}
function seek(t){
  cur=clamp(t,0,TOTAL); t0=cur; wall0=performance.now(); prevT=cur; forceRender=true;
  try{ if(audioOK){
    const sk=audio.seekable;
    if(cur<.1||(sk&&sk.length&&sk.end(sk.length-1)>=cur-.2)){ audio.currentTime=Math.min(cur,audio.duration||cur); audioNoSeek=false; }
    else { audioNoSeek=true; audio.pause(); }   // server without Range support: fall back to the wall clock
  } }catch(e){}
}
function toggle(){ if(!playing&&cur>=TOTAL-.05) seek(0); setPlaying(!playing); }
function buildMarkers(){
  prog.querySelectorAll('.mk').forEach(e=>e.remove()); jumps.innerHTML='';
  SCENES.forEach((sc,i)=>{
    if(i>0){ const m=document.createElement('div'); m.className='mk'+(sc.end?' sp':''); m.style.left=(sc.cut/TOTAL*100)+'%'; prog.appendChild(m); }
    const bt=document.createElement('button'); bt.textContent=sc.end?'END':sc.id; bt.title=sc.title+(sc.ph?' (placeholder)':''); if(sc.ph) bt.className='ph';
    bt.onclick=e=>{ e.stopPropagation(); seek(sc.cut+(i?SWAP+.05:0)); }; jumps.appendChild(bt);
  });
}
function fitStage(){ const v=$('#view'); stage.style.transform='scale('+Math.min(v.clientWidth/1080,v.clientHeight/1920)+')'; }
function fitHud(){ const bt=$('#bannerTxt'); bt.style.fontSize=''; if(bt.offsetWidth>1000) bt.style.fontSize=(60*1000/bt.offsetWidth)+'px'; }
let dragging=false;
const seekFromEvent=e=>{ const r=prog.getBoundingClientRect(); seek(clamp((e.clientX-r.left)/r.width,0,1)*TOTAL); };
prog.addEventListener('pointerdown',e=>{ dragging=true; prog.setPointerCapture(e.pointerId); seekFromEvent(e); });
prog.addEventListener('pointermove',e=>{ if(dragging) seekFromEvent(e); });
prog.addEventListener('pointerup',()=>{ dragging=false; });
btn.addEventListener('click',toggle); startOv.addEventListener('click',toggle);
stage.addEventListener('click',e=>{ if(e.target===startOv||startOv.contains(e.target)) return; toggle(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); toggle(); } else if(e.code==='ArrowRight') seek(cur+5); else if(e.code==='ArrowLeft') seek(cur-5); });
window.addEventListener('resize',fitStage);

function frame(){
  requestAnimationFrame(frame);
  if(playing){
    const pn=performance.now();
    if(audioActive()){ cur=audio.currentTime; t0=cur; wall0=pn; } else cur=t0+(pn-wall0)/1000;
    if(cur>=TOTAL){ cur=TOTAL; setPlaying(false); }
    fire(prevT,cur);
  }
  render(cur,forceRender); forceRender=false; prevT=cur;
}
compile(); buildMarkers(); fitStage(); fitHud();
const hm=/t=([\d.]+)/.exec(location.hash||''); if(hm){ seek(parseFloat(hm[1])); startOv.style.display='none'; }
requestAnimationFrame(()=>{ fitStage(); fitHud(); frame(); });

/* public handle so the next steps can plug scenes in:  GHOST.plugScene(3,[ B(41.34,'id',[1,1.08,540,900],()=>({bg,mid,fg,lab,ov}),{sfx:[[0.5,'ping']]}), ... ]) */
window.GHOST={SCENES,LINES,BEATS:()=>BEATS,plugScene,seek,toggle,SFX,B,
  kit:{an,g,P,Rc,Ci,El,Ln,Tx,TxO,pill,check,speedLines,sunburst,sparkles,starburst,swoosh,vig,motes,qmarks,drawPath,dashedDraw,magnifier,arrow,birds,hero,telescope,
       sky,sea,ship,barrel,crate,wheel,coil,deck,cabin,pantry,hold,rowboat,shipBell,paper,calendar,crewIcon,hullWall,ghostShape,mapBG,vis,rr,uid,fmt,INK}};
})();
</script>
